<title>Menu set</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap">
<style>
:root{--bg:#F8F4EC;--card:#FFFDF8;--ink:#2E241C;--mut:#857463;--gold:#A8834C;--gold2:#C9AE7C;--line:#E4D6BB;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F8F4EC}}
:root[data-theme="dark"]{--bg:#F8F4EC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:18px 12px 26px}
.hd{text-align:center;background:var(--card);border:1px solid var(--gold2);outline:1px solid var(--gold2);outline-offset:-6px;padding:20px 14px 14px}
.hd small{display:block;font-size:10px;letter-spacing:.32em;color:var(--gold);font-weight:500}
.hd h1{margin:6px 0 0;font:400 30px/1.1 Lora,Georgia,serif;letter-spacing:.14em;color:var(--gold)}
.hd p{margin:4px 0 0;font:500 15px Lora,Georgia,serif}
.hd p i{display:block;font-size:12px;color:var(--mut);font-weight:400}
.tbl{margin-top:10px}
.tbl h2{margin:0 0 4px;text-align:center;font:600 11px "Be Vietnam Pro",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tbl h2 i{font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--mut)}
.tg{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(6,auto);column-gap:30px;background:linear-gradient(var(--gold),var(--gold)) center/1.5px 100% no-repeat;border-top:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);padding:2px 0;margin-top:4px}@media (max-width:420px){.tg{column-gap:18px}.tr .n{font-size:14px}.tr .p{font-size:12.5px}}
.tr{display:flex;align-items:baseline;gap:6px;width:100%;border:0;border-bottom:1px dashed var(--line);background:none;padding:7px 2px;text-align:left;cursor:pointer;min-width:0}
.tr .n{flex:1;min-width:0;font:italic 600 15px Lora,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .p{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.tr sup,.tf sup{font-size:9px;color:var(--gold)}
.tr.on .n{color:var(--gold)}
.tf{font-size:11px;color:var(--mut);text-align:center;margin-top:6px;line-height:1.4}
.bs{color:var(--gold);font-style:normal}

/* thẻ set = tấm menu */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}.cd{min-width:0;width:100%}
@media (min-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cd{position:relative;aspect-ratio:720/1019;background:#fff center/100% 100% no-repeat;border-radius:4px;box-shadow:0 4px 16px rgba(60,40,20,.14);scroll-margin-top:70px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14% 15% 9%;color:var(--c,#3a2f26)}
.cd.on{box-shadow:0 0 0 3px var(--gold),0 4px 16px rgba(60,40,20,.14)}
.cd .br{font:500 10px "Be Vietnam Pro",sans-serif;letter-spacing:.3em;opacity:.8}
.cd h3{margin:2px 0 0;font:700 34px/1.05 "Dancing Script",cursive;color:var(--t,var(--c))}
.cd .best{font-size:9.5px;letter-spacing:.18em;font-weight:600;margin-top:2px;color:var(--t,var(--c))}
.cd .pr{margin-top:4px;font:600 17px Lora,Georgia,serif;letter-spacing:.04em;color:var(--t,var(--c))}
.cd .pr small{display:block;font:italic 11px Lora,Georgia,serif;opacity:.85;letter-spacing:0}
.cd .ph{display:flex;justify-content:center;gap:5px;margin-top:8px;flex-wrap:nowrap;width:100%}.cd .ph button{flex:0 0 48px;width:48px;height:48px;border-radius:50%;padding:2px;border:1px solid var(--t,var(--gold));background:#fff;cursor:zoom-in;flex:0 0 auto}.cd .ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.cd .ds.wi{display:flex;align-items:center;justify-content:center;gap:8px;text-align:left}.cd .ds.wi>div{min-width:0}.cd .dp{flex:0 0 40px;width:40px;height:40px;border-radius:50%;padding:1.5px;border:1px solid var(--t,var(--gold));background:#fff;cursor:zoom-in}.cd .dp img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.cd .co{margin-top:7px;width:100%}
.cd .co h4{margin:0 0 2px;font:600 10.5px "Be Vietnam Pro",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--t,var(--c))}
.cd .co h4 i{font-style:normal;font-weight:400;letter-spacing:.06em;text-transform:none;opacity:.8}
.cd .ds{margin:2px 0;line-height:1.2}
.cd .ds b{font:600 13.5px "Be Vietnam Pro",sans-serif}
.cd .ds b span{font-weight:500;opacity:.8;font-size:12px}
.cd .ds small{display:block;font:italic 11.5px Lora,Georgia,serif;opacity:.82}
.cd .nt{margin-top:6px;font:italic 11.5px Lora,Georgia,serif;opacity:.9}
.cd .act{margin-top:auto;padding-top:10px;width:100%;display:flex;flex-direction:column;gap:6px;align-items:center}
.cd .sel{width:100%;max-width:240px;border:0;border-radius:3px;padding:9px 10px;background:var(--t,var(--gold));color:#fff;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.cd .sel small{display:block;font-weight:400;font-size:10.5px;opacity:.9}
.cd .lk{border:0;background:none;padding:2px 4px;font-size:12px;text-decoration:underline;cursor:pointer;color:var(--t,var(--c))}
.cd .onr{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.cd .onr b{font-size:13px;color:var(--t,var(--c))}
.st{display:inline-flex;align-items:center;border:1px solid var(--gold);border-radius:16px;overflow:hidden;background:#fff}
.st button{border:0;background:none;width:30px;height:28px;font-size:17px;color:var(--gold);cursor:pointer}
.st span{min-width:20px;text-align:center;font-weight:600}

/* hộp chọn khi bấm Chọn set */
.ov{position:fixed;inset:0;z-index:50;background:rgba(30,20,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:#FFFDF8;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;padding:14px 14px 16px}
.sh .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh h3{margin:0;font:700 26px "Dancing Script",cursive;color:var(--gold)}
.sh h3 small{display:block;font:500 12px "Be Vietnam Pro",sans-serif;color:var(--mut)}
.sh .x{border:1px solid var(--line);background:#fff;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.blk{margin-top:10px;padding:9px 10px;border:1px dashed var(--gold2);border-radius:6px;background:#FBF6EC}
.blk.miss{border-color:#B4472F;background:#FCEEE9}
.blk .h{font-size:13px;font-weight:600}
.blk .h i{display:block;font-weight:400;font-style:italic;color:var(--mut);font-size:11px}
.dk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.dk.one{grid-template-columns:1fr}
.dk .pc{display:flex;flex-direction:column;gap:5px}
.dk .pc b{font-size:12px;color:var(--gold)}
.dk select{font:13px "Be Vietnam Pro",sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 6px;min-width:0;width:100%}
.dk select.mi{border-color:#B4472F}
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.wg button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px;cursor:pointer}
.wg button img{width:42px;height:42px;border-radius:4px;object-fit:cover;flex:0 0 42px}
.wg button b{display:block;font-size:12.5px}
.wg button span{display:block;font-size:10.5px;color:var(--mut);line-height:1.25}
.wg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.dsn{margin-top:6px;font-size:11.5px;color:var(--mut);line-height:1.4}
.dsn b{color:var(--gold)}
.dsx{margin-top:5px;font-size:12.5px;color:#B4472F;font-weight:600}
.ok{margin-top:12px;width:100%;border:0;border-radius:4px;padding:12px;background:var(--gold);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.ok small{display:block;font-weight:400;font-size:11px;opacity:.9}
.err{margin-top:8px;color:#B4472F;font-size:12.5px;text-align:center}

/* xem ảnh món */
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,14,8,.9);display:flex;align-items:center;justify-content:center;padding:12px}
.lb .bx{max-width:560px;width:100%;text-align:center;color:#F3EADB}
.lb img{max-width:100%;max-height:62vh;border-radius:6px;display:block;margin:0 auto}
.lb .t{margin-top:8px;font:500 15px Lora,Georgia,serif}
.lb .nv{display:flex;justify-content:center;gap:8px;margin-top:10px}
.lb .nv button{border:1px solid #C9AE7C;background:none;color:#F3EADB;border-radius:4px;padding:7px 14px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:70;background:var(--ink);color:#fff;padding:9px 14px;border-radius:4px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
</style>

window.decoIncl=()=>{ const c=SETS.find(c=>SC[c.n]&&c.c.some(s=>s.d.some(d=>/trang trí/i.test(d.vn)))); return c?sn(c):''; };
function surs(c){ const P=PK[c.n]||{}, out=[]; groups(c).filter(g=>g.kind==='d').forEach(g=>{ const x=drkOf(P[g.L]); if(x&&x.p>DRINK_FREE) out.push({k:g.k,x,diff:x.p-DRINK_FREE}); }); return out; }
const SPOS={"Fresco": "Fresco menu ( salad cá ngừ, suop bông cải trắng, sò điệp áp chảo sốt bắp, tôm hùm nướng phô mai, bò wellington, kem chanh)", "Feasty": "Feasty menu ( salad trái cây sốt cam, soup tomyum, sườn cứu nướng, cả tuyết áp chảo, Tráng miệng)", "The Tasty": "The tasty ( salad tôm, sò điệp áp chảo, bò wellington, cá hồi nướng sốt mù tạt vàng, desert)", "My Honey": "Valentine's my honey ( salad thái tôm xoài, suop tomyum, bào ngư nướng, ức vịt nướng, mỳ ý carbonara, panna cotta)", "U & I": "Set valentine night u&i ( salad trái cây sốt cam, soup bào ngư, topblade, mỳ ý gà sootskem nắm , panna cotta)", "With Love": "Set with love ( salad nga, bào ngư (2), mỳ ý gà sốt kem, topblade, pannA0a cotta)", "Together": "Set together ( salad tôm xoài, vẹm xanh sốt thảo mộc, topblade, mỳ ý carbonara, pana cotta )"};
window.getSets=()=>SETS.filter(c=>SC[c.n]).flatMap(c=>[({n:(SPOS[c.n]||sn(c))+' ('+c.g+' khách)',en:'Set menu · '+c.g+' guests',q:SC[c.n],p:unit(c),vadd:vbs(c),o:[optText(c),inc(c)?'giá menu '+vnd(c.price)+' đã gồm VAT 8% → tính '+vnd(unit(c))+' chưa VAT':''].filter(Boolean).join(' · '),f:'f-set'})].concat(surs(c).map(o=>({n:'Bù đồ uống: '+o.x.v+' (ly '+o.k+' · '+sn(c)+')',en:'Drink upgrade',q:SC[c.n],p:o.diff,o:'Set gồm đồ uống đến '+vnd(DRINK_FREE)+'/ly; '+o.x.v+' giá '+vnd(o.x.p)+' nên bù '+vnd(o.diff)+' + VAT',f:'f-set'}))));

/* ảnh món của set (bấm xem) */
function pics(c){ const L=[]; c.c.forEach(s=>s.d.forEach(d=>{ if(d.img&&!L.some(x=>x.k===d.img)) L.push({k:d.img,t:d.vn}); })); c.img.forEach(k=>{ if(!L.some(x=>x.k===k)) L.push({k,t:'Set menu '+c.n}); }); return L; }
let LB=null;
function lbShow(){ const x=LB.L[LB.i]; $('#lbI').src='s/'+x.k+'.jpg'; $('#lbT').textContent=x.t+'  ('+(LB.i+1)+'/'+LB.L.length+')'; $('#lb').hidden=false; }

/* thẻ set giống tấm menu */
function card(c){ const q=SC[c.n]||0, S=STY[c.n]||['#3a2f26','#A8834C'], bg=BG[c.n];
  const dishes=c.c.map(s=>`<div class="co"><h4>${esc(s.h)} <i>· ${CEN[s.h]||''}</i></h4>${s.d.map(d=>`<div class="ds${d.img?' wi':''}">${d.img?`<button type="button" class="dp" data-pset="${esc(c.n)}" data-pk="${d.img}" aria-label="Xem ảnh ${esc(d.vn)}"><img loading="lazy" src="s/${d.img}.jpg" alt=""></button>`:''}<div><b>${esc(d.vn)}${d.qn?` <span>(${esc(d.qn)})</span>`:(d.q&&+d.q>1?` <span>x${esc(d.q)}</span>`:'')}</b>${d.en?`<small>${esc(d.en)}</small>`:''}</div></div>`).join('')}</div>`).join('');
  const per=vnd(Math.round(c.price/c.g/1000)*1000);
  return `<article class="cd${q?' on':''}" data-set="${esc(c.n)}" style="--c:${S[0]};--t:${S[1]};${bg?`background-image:url(bg/${bg[0]}.jpg);background-color:${bg[1]};`:''}${PAD[c.n]?`padding:${PAD[c.n]};`:''}">
   <div class="br">APES RESTAURANT</div><h3>${esc(c.n)}</h3>${BEST.has(c.n)?'<div class="best">★ BEST SELLER</div>':''}
   <div class="pr">${vnd(c.price)} / ${c.g} khách<small>≈ ${per}/khách · ${esc(c.tax)}</small></div>
   ${dishes}
   ${c.note?`<div class="nt">✦ ${esc(c.note)}</div>`:''}
   <div class="act">${q?`<div class="onr"><b>✓ Đã chọn</b><span class="st"><button type="button" data-q="${esc(c.n)}" data-d="-1" aria-label="Bớt 1 set">−</button><span>${q}</span><button type="button" data-q="${esc(c.n)}" data-d="1" aria-label="Thêm 1 set">+</button></span></div>${groups(c).length?`<button type="button" class="lk" data-edit="${esc(c.n)}">Sửa lựa chọn · Edit</button>`:''}`
     :`<button type="button" class="sel" data-sel="${esc(c.n)}">Chọn set ${esc(c.n)}<small>Select this set</small></button>`}</div>
  </article>`; }

/* hộp chọn độ chín / đồ uống khi bấm Chọn set */
let MS=null, MERR=false;
function drawM(){ const c=SETS.find(x=>x.n===MS), P=PK[c.n]||{}, G=groups(c); let h=`<div class="hh"><h3>${esc(c.n)}<small>Mời anh/chị chọn giúp em vài lựa chọn · Please choose</small></h3><button type="button" class="x" id="mX">Đóng</button></div>`;
  const byD=[]; G.forEach(g=>{ if(!byD.includes(g.d)) byD.push(g.d); });
  byD.forEach(d=>{ const gs=G.filter(g=>g.d===d), ms=MERR&&gs.some(g=>!P[g.L]);
    if(d.dsel){ const L=DRK(), sx=surs(c);
      const opts=sel=>{ let o='<option value="">— Chọn đồ uống —</option>', last=''; L.forEach(x=>{ if(x.g!==last){ if(last) o+='</optgroup>'; o+=`<optgroup label="${esc(x.g)}">`; last=x.g; } o+=`<option value="${esc(x.v)}"${sel===x.v?' selected':''}>${esc(x.v)} – ${Math.round(x.p/1000)}k${x.p>DRINK_FREE?' · bù '+Math.round((x.p-DRINK_FREE)/1000)+'k':' · miễn phí'}</option>`; }); return o+(last?'</optgroup>':''); };
      h+=`<div class="blk${ms?' miss':''}"><div class="h">Đồ uống trong set – ${d.dsel} ly (mỗi khách 1 ly)<i>Drinks – 1 per guest</i></div>`+(L.length?`<div class="dk">${gs.map(g=>`<div class="pc"><b>Ly ${g.k}</b><select data-l="${esc(g.L)}"${ms&&!P[g.L]?' class="mi"':''}>${opts(P[g.L]||'')}</select></div>`).join('')}</div>`:'<div class="dsn">Nhân viên sẽ hỏi anh/chị chọn đồ uống khi xác nhận.</div>')+`<div class="dsn">${/trang trí/i.test(d.vn)?'Set up bàn đến <b>130K</b> &amp; ':''}Đồ uống đến <b>75K/ly</b> đã gồm trong set – chọn loại cao hơn chỉ <b>bù phần chênh lệch + VAT</b>.</div>${sx.length?`<div class="dsx">Bù thêm: ${sx.map(o=>esc(o.x.v)+' +'+vnd(o.diff)).join(' · ')} (chưa VAT)</div>`:''}</div>`; }
    else if(gs[0].kind==='w'){ const g=gs[0], sel=P[g.L];
      h+=`<div class="blk${ms?' miss':''}"><div class="h">${esc(g.L)}${+d.q>1?' (cho cả '+d.q+' '+(isWD(d)?'ly':'phần')+')':''}<i>Choose 1</i></div><div class="wg">${g.opts.map(o=>`<button type="button" data-l="${esc(g.L)}" data-v="${esc(o.n)}" aria-pressed="${sel===o.n}">${o.img?`<img loading="lazy" src="s/${o.img}.jpg" alt="">`:''}<div><b>${esc(o.n)}</b>${o.desc?`<span>${esc(o.desc)}</span>`:''}</div></button>`).join('')}</div></div>`; }
    else { const ks=[...new Set(gs.map(g=>g.k))];
      h+=`<div class="blk${ms?' miss':''}"><div class="h">${esc(d.vn)}${d.q&&+d.q>1?' x'+esc(d.q):''} – chọn ${d.done?'độ chín':''}${d.sauce?', sốt':''}${d.side?', ăn kèm':''}<i>${esc(d.en||'')}</i></div><div class="dk${ks.length<2?' one':''}">${ks.map(k=>`<div class="pc">${ks.length>1?`<b>Phần ${k}</b>`:''}${gs.filter(g=>g.k===k).map(g=>`<select data-l="${esc(g.L)}"${ms&&!P[g.L]?' class="mi"':''}><option value="">— ${esc(g.lab.split(' · ')[0])} —</option>${g.opts.map(o=>`<option value="${esc(o[0])}"${P[g.L]===o[0]?' selected':''}>${esc(o[0])} · ${esc(o[1])}</option>`).join('')}</select>`).join('')}</div>`).join('')}</div></div>`; }
  });
  const m=missing(c);
  h+=`<button type="button" class="ok" id="mOk">${SC[c.n]?'Lưu lựa chọn':'Xác nhận chọn set '+esc(c.n)}<small>${vnd(c.price)} / ${c.g} khách</small></button>${MERR&&m.length?'<div class="err">Anh/chị chọn giúp đủ các ô viền đỏ nhé · Please complete the red boxes</div>':''}`;
  $('#sh').innerHTML=h; }
function openM(n){ MS=n; MERR=false; drawM(); $('#ov').hidden=false; }
function closeM(){ $('#ov').hidden=true; MS=null; }
function pickSet(c){ SC[c.n]=SC[c.n]||1; save(); render(); toast('Đã chọn '+sn(c)+' ✓'); try{ parent.refresh&&parent.refresh(); }catch(z){} }

function render(){ $('#tg').innerHTML=SETS.map(c=>`<button type="button" class="tr${SC[c.n]?' on':''}" data-jump="${esc(c.n)}"><span class="n">${SC[c.n]?'✓ ':''}${esc(c.n)}${BEST.has(c.n)?' <b class="bs">★</b>':''}</span><span class="p">${kk(c.price)}${inc(c)?'<sup>✦</sup>':''}</span></button>`).join('');
  $('#cards').innerHTML=SETS.map(card).join(''); save(); }
function goEl(el,off){ try{ const f=window.frameElement; if(f&&parent!==window){ let tb=70; try{ tb=parent.document.querySelector('.tb').offsetHeight; }catch(x){} parent.scrollTo({top:f.offsetTop+el.getBoundingClientRect().top+(window.scrollY||0)-tb-(off||8),behavior:'instant'}); return; } }catch(e){} el.scrollIntoView({behavior:'instant',block:'start'}); }
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.id==='mX'){ closeM(); return; }
  if(b.id==='mOk'){ const c=SETS.find(x=>x.n===MS); if(missing(c).length){ MERR=true; drawM(); const el=$('#sh .miss'); if(el) el.scrollIntoView({block:'center'}); return; } closeM(); pickSet(c); return; }
  if(b.id==='lbX'){ $('#lb').hidden=true; return; } if(b.id==='lbP'){ LB.i=(LB.i-1+LB.L.length)%LB.L.length; lbShow(); return; } if(b.id==='lbN'){ LB.i=(LB.i+1)%LB.L.length; lbShow(); return; }
  if(b.dataset.v!==undefined && MS){ (PK[MS]=PK[MS]||{})[b.dataset.l]=b.dataset.v; save(); drawM(); return; }
  if(b.dataset.pset){ const L=pics(SETS.find(x=>x.n===b.dataset.pset)); LB={L,i:Math.max(0,L.findIndex(x=>x.k===b.dataset.pk))}; lbShow(); return; }
  if(b.dataset.pics){ LB={L:pics(SETS.find(x=>x.n===b.dataset.pics)),i:0}; lbShow(); return; }
  if(b.dataset.jump){ const el=[...document.querySelectorAll('[data-set]')].find(x=>x.dataset.set===b.dataset.jump); if(el) goEl(el,8); return; }
  if(b.dataset.sel){ const c=SETS.find(x=>x.n===b.dataset.sel); if(groups(c).length&&missing(c).length) openM(c.n); else pickSet(c); return; }
  if(b.dataset.edit){ openM(b.dataset.edit); return; }
  if(b.dataset.q){ const n=b.dataset.q; SC[n]=(SC[n]||0)+(+b.dataset.d); if(SC[n]<=0) delete SC[n]; render(); return; }
});
document.addEventListener('change',e=>{ const sl=e.target.closest('#sh select[data-l]'); if(!sl||!MS) return; (PK[MS]=PK[MS]||{}); if(sl.value) PK[MS][sl.dataset.l]=sl.value; else delete PK[MS][sl.dataset.l]; save(); const x=drkOf(sl.value); drawM(); if(SC[MS]){ render(); try{ parent.refresh&&parent.refresh(); }catch(z){} } if(x&&x.p>DRINK_FREE) toast(x.v+' giá '+vnd(x.p)+' – set gồm đồ uống đến '+vnd(DRINK_FREE)+'/ly nên bù '+vnd(x.p-DRINK_FREE)+' + VAT'); });
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeM(); });
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') $('#lb').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#lb').hidden=true; closeM(); } });
render(); (function w(i){ if(DRK().length||i>40){ return; } setTimeout(()=>w(i+1),250); })(0);
</script>
</body></html>

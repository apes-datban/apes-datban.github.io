<style>

/* hộp chọn khi bấm Chọn set */

.dk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}

.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.wg button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px;cursor:pointer}
.wg button img{width:42px;height:42px;border-radius:4px;object-fit:cover;flex:0 0 42px}

.dsn{margin-top:6px;font-size:11.5px;color:var(--mut);line-height:1.4}

.dsx{margin-top:5px;font-size:12.5px;color:#B4472F;font-weight:600}

.err{margin-top:8px;color:#B4472F;font-size:12.5px;text-align:center}

.lb{position:fixed;inset:0;z-index:60;background:rgba(20,14,8,.9);display:flex;align-items:center;justify-content:center;padding:12px}

[hidden]{display:none!important}

/* nút chọn 3D */html body button.sel{background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 55%,rgba(0,0,0,.08));box-shadow:0 3px 0 rgba(0,0,0,.45),0 5px 9px rgba(40,28,15,.22),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s;}html body button.sel:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.45),0 1px 2px rgba(40,28,15,.2),inset 0 1px 0 rgba(255,255,255,.25)}html body button.sel{box-shadow:0 3px 0 color-mix(in srgb,var(--t,var(--gold)) 60%,#000),0 5px 9px rgba(40,28,15,.22),inset 0 1px 0 rgba(255,255,255,.35);margin-bottom:3px}

/* canh nội dung giữa khung nền, trên dưới cân nhau */.cd{justify-content:center}.cd .act{margin-top:0!important;padding-top:14px}



/* set = ảnh menu gốc + nút chọn */.cd.og{aspect-ratio:auto!important;padding:0!important;background:#fff!important;overflow:hidden;justify-content:flex-start}.cd.og .ogi{display:block;width:100%;height:auto}.cd.og .act{margin-top:0!important;padding:12px 12px 14px;background:#fff}

/* làm đẹp thẻ set ảnh gốc */.cards{gap:22px!important}.cd.og{border-radius:14px;border:1px solid rgba(168,131,76,.28);box-shadow:0 8px 24px rgba(60,40,20,.13)!important}.cd.og.on{box-shadow:0 0 0 3px var(--t),0 8px 24px rgba(60,40,20,.13)!important}.cd.og .act{background:color-mix(in srgb,var(--t) 7%,#fffdf8)!important;border-top:1px solid color-mix(in srgb,var(--t) 22%,transparent);padding:14px 14px 16px!important}.cd.og .sel{max-width:280px;border-radius:8px;padding:11px 12px;font-size:15px}.sec{grid-column:1/-1;margin:14px 0 -6px;text-align:center;font:500 22px Lora,Georgia,serif;color:var(--gold);letter-spacing:.04em;display:flex;align-items:center;gap:12px}.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.45}.sec i{display:block;font:italic 12px Lora,Georgia,serif;color:var(--mut);letter-spacing:0}.tr .p small.g4{display:block;font-size:10px;font-weight:500;color:var(--mut);text-align:right;line-height:1.1;letter-spacing:0;font-family:"Be Vietnam Pro",sans-serif}.tr .n{white-space:normal!important;overflow:visible!important;overflow-wrap:anywhere}@media (max-width:400px){.tr .n{font-size:13px!important}.tr{gap:4px!important}}
.later{display:block;width:100%;margin:10px 0 4px;border:1.5px dashed #A8834C;background:#fff;color:#8a6a35;border-radius:10px;padding:9px 10px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;line-height:1.25}.later small{display:block;font-weight:500;font-style:italic;font-size:11.5px;opacity:.85}.later.on{background:#A8834C;color:#fff;border-style:solid}

   <div class="zorn">✦</div>${secs}${c.note?`<div class="znt">✦ ${esc(c.note)}</div>`:''}</div></div>
   <div class="act">${q?`<div class="onr"><b>✓ Đã chọn</b><span class="st"><button type="button" data-q="${esc(c.n)}" data-d="-1" aria-label="Bớt 1 set">−</button><span>${q}</span><button type="button" data-q="${esc(c.n)}" data-d="1" aria-label="Thêm 1 set">+</button></span></div>${groups(c).length?`<button type="button" class="lk" data-edit="${esc(c.n)}">Sửa lựa chọn · Edit</button>`:''}`
     :`<button type="button" class="sel" data-sel="${esc(c.n)}">Chọn set ${esc(c.n)}<small>Select this set</small></button>`}</div></article>`; }
/* tự co chữ cho vừa khung nền */
addEventListener('resize',()=>{ clearTimeout(pzFit.t); pzFit.t=setTimeout(pzFit,200); });
function pzFit(){ document.querySelectorAll('.cd.pz .pzb').forEach(b=>{ let k=1; b.style.setProperty('--k',k); for(let i=0;i<14&&b.scrollHeight>b.clientHeight+1;i++){ k-=.03; b.style.setProperty('--k',k.toFixed(2)); } }); }
function card(c){ const q=SC[c.n]||0;
  if(PZ[c.n]) return cardP(c,q);
  if(OG[c.n]) return `<article class="cd og${q?' on':''}" data-set="${esc(c.n)}" style="--t:${(STY[c.n]||[0,'#A8834C'])[1]}"><img class="ogi" src="sg/${OG[c.n]}.jpg?v=1" alt="Menu set ${esc(c.n)}" loading="lazy">
   <div class="act">${q?`<div class="onr"><b>✓ Đã chọn</b><span class="st"><button type="button" data-q="${esc(c.n)}" data-d="-1" aria-label="Bớt 1 set">−</button><span>${q}</span><button type="button" data-q="${esc(c.n)}" data-d="1" aria-label="Thêm 1 set">+</button></span></div>${groups(c).length?`<button type="button" class="lk" data-edit="${esc(c.n)}">Sửa lựa chọn · Edit</button>`:''}`
     :`<button type="button" class="sel" data-sel="${esc(c.n)}">Chọn set ${esc(c.n)}<small>Select this set</small></button>`}</div></article>`;
  return card0(c); }
function card0(c){ const q=SC[c.n]||0, S=STY[c.n]||['#3a2f26','#A8834C'], bg=BG[c.n];
  const dishes=c.c.map(s=>`<div class="co"><h4>${esc(s.h)} <i>· ${CEN[s.h]||''}</i></h4>${s.d.map(d=>`<div class="ds${d.img?' wi':''}">${d.img?`<button type="button" class="dp" data-pset="${esc(c.n)}" data-pk="${d.img}" aria-label="Xem ảnh ${esc(d.vn)}"><img loading="lazy" src="s/${d.img}.jpg" alt=""></button>`:''}<div><b>${esc(d.vn)}${d.qn?` <span>(${esc(d.qn)})</span>`:(d.q&&+d.q>1?` <span>x${esc(d.q)}</span>`:'')}</b>${d.en?`<small>${esc(d.en)}</small>`:''}</div></div>`).join('')}</div>`).join('');
  const per=vnd(Math.round(c.price/c.g/1000)*1000);
  return `<article class="cd${q?' on':''}" data-set="${esc(c.n)}" style="--c:${S[0]};--t:${S[1]};${bg?`background-image:url(bg/${bg[0]}.jpg);background-color:${bg[1]};`:''}${PAD[c.n]?`padding:${PAD[c.n]};`:''}">
   <div class="br">APES RESTAURANT</div><h3>${esc(c.n)}</h3>${BEST.has(c.n)?'<div class="best">★ BEST SELLER</div>':''}
   <div class="pr">${vnd(c.price)} / ${c.g} khách<small>≈ ${per}/khách · ${esc(c.tax)}</small></div>
   ${dishes}
   ${c.note?`<div class="nt">✦ ${esc(c.note)}</div>`:''}
   <div class="act">${q?`<div class="onr"><b>✓ Đã chọn</b><span class="st"><button type="button" data-q="${esc(c.n)}" data-d="-1" aria-label="Bớt 1 set">−</button><span>${q}</span><button type="button" data-q="${esc(c.n)}" data-d="1" aria-label="Thêm 1 set">+</button></span></div>${groups(c).length?`<button type="button" class="lk" data-edit="${esc(c.n)}">Sửa lựa chọn · Edit</button>`:''}`
     :`<button type="button" class="sel" data-sel="${esc(c.n)}">Chọn set ${esc(c.n)}<small>Select this set</small></button>`}</div>
  </article>`; }

/* hộp chọn độ chín / đồ uống khi bấm Chọn set */
let MS=null, MERR=false;
function drawM(){ const c=SETS.find(x=>x.n===MS), P=PK[c.n]||{}, G=groups(c); let h=`<div class="hh"><h3>${esc(c.n)}<small>Mời anh/chị chọn giúp em vài lựa chọn · Please choose</small></h3><button type="button" class="x" id="mX">Đóng<small class="bi">Close</small></button></div>`;
  const MM=missing(c), byD=[]; G.forEach(g=>{ if(!byD.includes(g.d)) byD.push(g.d); });
  byD.forEach(d=>{ const gs=G.filter(g=>g.d===d), ms=MERR&&gs.some(g=>MM.some(x=>x.L===g.L));
    if(d.dsel){ const L=DRK(), sx=surs(c);
      const opts=sel=>{ let o='<option value="">— Chọn đồ uống —</option>', last=''; L.forEach(x=>{ if(x.g!==last){ if(last) o+='</optgroup>'; o+=`<optgroup label="${esc(x.g)}">`; last=x.g; } o+=`<option value="${esc(x.v)}"${sel===x.v?' selected':''}>${esc(x.v)} – ${Math.round(x.p/1000)}k${x.p>DRINK_FREE?' · bù '+Math.round((x.p-DRINK_FREE)/1000)+'k':' · miễn phí'}</option>`; }); return o+(last?'</optgroup>':'')+(PHU?`<option value="Chọn sau"${sel==='Chọn sau'?' selected':''}>Chọn sau · Decide later</option>`:''); };
      h+=`<div class="blk${ms?' miss':''}"><div class="h">Đồ uống trong set – ${d.dsel} ly (mỗi khách 1 ly)<i>Drinks – 1 per guest</i></div>`+(L.length?`<div class="dk">${gs.map(g=>`<div class="pc"><b>Ly ${g.k}</b><select data-l="${esc(g.L)}"${ms&&!P[g.L]?' class="mi"':''}>${opts(P[g.L]||'')}</select></div>`).join('')}</div>`:'<div class="dsn">Nhân viên sẽ hỏi anh/chị chọn đồ uống khi xác nhận.</div>')+`<div class="dsn">${/trang trí/i.test(d.vn)?'Set up bàn đến <b>130K</b> &amp; ':''}Đồ uống đến <b>75K/ly</b> đã gồm trong set – chọn loại cao hơn chỉ <b>bù phần chênh lệch + VAT</b>.</div>${sx.length?`<div class="dsx">Bù thêm: ${sx.map(o=>esc(o.x.v)+' +'+vnd(o.diff)).join(' · ')} (chưa VAT)</div>`:''}</div>`; }
    else if(gs[0].kind==='w'){ const g=gs[0], sel=P[g.L];
      h+=`<div class="blk${ms?' miss':''}"><div class="h">${esc(g.L)}${+d.q>1?' (cho cả '+d.q+' '+(isWD(d)?'ly':'phần')+')':''}<i>Choose 1</i></div><div class="wg">${g.opts.map(o=>`<button type="button" data-l="${esc(g.L)}" data-v="${esc(o.n)}" aria-pressed="${sel===o.n}">${o.img?`<img loading="lazy" src="s/${o.img}.jpg" alt="">`:''}<div><b>${esc(o.n)}</b>${o.desc?`<span>${esc(o.desc)}</span>`:''}</div></button>`).join('')}</div></div>`; }
    else { const ks=[...new Set(gs.map(g=>g.k))];
      h+=`<div class="blk${ms?' miss':''}"><div class="h">${esc(d.vn)}${d.q&&+d.q>1?' x'+esc(d.q):''} – chọn ${d.done?'độ chín':''}${d.sauce?', sốt':''}${d.side?', ăn kèm':''}<i>${esc(d.en||'')}</i></div><div class="dk${ks.length<2?' one':''}">${ks.map(k=>`<div class="pc">${ks.length>1?`<b>Phần ${k}</b>`:''}${gs.filter(g=>g.k===k).map(g=>`<select data-l="${esc(g.L)}"${ms&&!P[g.L]?' class="mi"':''}><option value="">— ${esc(g.lab.split(' · ')[0])} —</option>${g.opts.map(o=>`<option value="${esc(o[0])}"${P[g.L]===o[0]?' selected':''}>${esc(o[0])} · ${esc(o[1])}</option>`).join('')}</select>`).join('')}</div>`).join('')}</div></div>`; }
  });
  const m=missing(c);
  h+=`<button type="button" class="ok" id="mOk">${SC[c.n]?'Lưu lựa chọn<small class="bi">Save</small>':'Xác nhận chọn set '+esc(c.n)+'<small class="bi">Confirm set</small>'}<small>${vnd(c.price)} / ${c.g} khách</small></button>${MERR&&m.length?'<div class="err">Anh/chị chọn giúp đủ các ô viền đỏ nhé · Please complete the red boxes</div>':''}`;
  $('#sh').innerHTML=h;
  if(PHU) document.querySelectorAll('#sh .blk').forEach(b=>{ const ss=[...b.querySelectorAll('select[data-l]')]; if(!ss.length) return; const all=ss.every(x=>x.value==='Chọn sau');
    const bt=document.createElement('button'); bt.type='button'; bt.className='later'+(all?' on':''); bt.innerHTML=(all?'✓ ':'⏳ ')+'Chọn sau – nhân viên hỏi tại bàn<small>Decide later – our staff will ask at the table</small>';
    bt.onclick=()=>{ const P=(PK[MS]=PK[MS]||{}); ss.forEach(x=>{ P[x.dataset.l]='Chọn sau'; }); save(); drawM(); if(SC[MS]){ render(); try{ parent.refresh&&parent.refresh(); }catch(z){} } };
    const dk=[...b.querySelectorAll('.dk')].pop(); if(dk) dk.after(bt); else b.appendChild(bt); }); }
function openM(n){ MS=n; MERR=false; drawM(); $('#ov').hidden=false; }
function closeM(){ $('#ov').hidden=true; MS=null; }
function pickSet(c){ const moi=!SC[c.n]; SC[c.n]=SC[c.n]||1; save(); render(); toast('Đã chọn '+sn(c)+' ✓'); try{ parent.refresh&&parent.refresh(); }catch(z){} if(moi&&PHU) try{ parent.goBanh&&parent.goBanh(); }catch(z){} }

const ORD=()=>[...SETS].sort((a,b)=>(a.g-b.g)||(b.price-a.price));
function render(){ $('#tg').style.gridTemplateRows='repeat('+Math.ceil(SETS.length/2)+',auto)'; $('#tg').innerHTML=ORD().map(c=>`<button type="button" class="tr${SC[c.n]?' on':''}" data-jump="${esc(c.n)}"><span class="n">${SC[c.n]?'✓ ':''}${esc(c.n)}${BEST.has(c.n)?' <b class="bs">★</b>':''}</span><span class="p">${kk(c.price)}${inc(c)?'<sup>✦</sup>':''}${c.g!==2?'<small class="g4">'+c.g+' khách</small>':''}</span></button>`).join('');
  $('#cards').innerHTML=ORD().map((c,i,a)=>(c.g!==2&&(i===0||a[i-1].g===2)?'<h2 class="sec">Set cho '+c.g+' khách<i>Set menus for '+(c.g===4?'four':c.g)+'</i></h2>':'')+card(c)).join(''); save(); pzFit(); try{ document.fonts.ready.then(pzFit); }catch(e){} }
function goEl(el,off){ try{ const f=window.frameElement; if(f&&parent!==window){ let tb=70; try{ tb=parent.document.querySelector('.tb').offsetHeight; }catch(x){} parent.scrollTo({top:f.offsetTop+el.getBoundingClientRect().top+(window.scrollY||0)-tb-(off||8),behavior:'instant'}); return; } }catch(e){} el.scrollIntoView({behavior:'instant',block:'start'}); }
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.id==='mX'){ closeM(); return; }
  if(b.id==='mOk'){ const c=SETS.find(x=>x.n===MS); if(missing(c).length){ MERR=true; drawM(); const el=$('#sh .miss'); if(el) el.scrollIntoView({block:'center'}); return; } closeM(); pickSet(c); return; }
  if(b.id==='lbX'){ $('#lb').hidden=true; return; } if(b.id==='lbP'){ LB.i=(LB.i-1+LB.L.length)%LB.L.length; lbShow(); return; } if(b.id==='lbN'){ LB.i=(LB.i+1)%LB.L.length; lbShow(); return; }
  if(b.dataset.v!==undefined && MS){ (PK[MS]=PK[MS]||{})[b.dataset.l]=b.dataset.v; save(); drawM(); return; }
  if(b.dataset.pset){ const L=pics(SETS.find(x=>x.n===b.dataset.pset)); LB={L,i:Math.max(0,L.findIndex(x=>x.k===b.dataset.pk))}; lbShow(); return; }
  if(b.dataset.pics){ LB={L:pics(SETS.find(x=>x.n===b.dataset.pics)),i:0}; lbShow(); return; }
  if(b.dataset.jump){ const el=[...document.querySelectorAll('[data-set]')].find(x=>x.dataset.set===b.dataset.jump); if(el) goEl(el,8); return; }
  if(b.dataset.sel){ const c=SETS.find(x=>x.n===b.dataset.sel); if(groups(c).length&&missing(c).length) openM(c.n); else pickSet(c); return; }
  if(b.dataset.edit){ openM(b.dataset.edit); return; }
  if(b.dataset.q){ const n=b.dataset.q; SC[n]=(SC[n]||0)+(+b.dataset.d); if(SC[n]<=0) delete SC[n]; render(); return; }
});
document.addEventListener('change',e=>{ const sl=e.target.closest('#sh select[data-l]'); if(!sl||!MS) return; (PK[MS]=PK[MS]||{}); if(sl.value) PK[MS][sl.dataset.l]=sl.value; else delete PK[MS][sl.dataset.l]; save(); const x=drkOf(sl.value); drawM(); if(SC[MS]){ render(); try{ parent.refresh&&parent.refresh(); }catch(z){} } if(x&&x.p>DRINK_FREE) toast(x.v+' giá '+vnd(x.p)+' – set gồm đồ uống đến '+vnd(DRINK_FREE)+'/ly nên bù '+vnd(x.p-DRINK_FREE)+' + VAT'); });
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeM(); });
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') $('#lb').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#lb').hidden=true; closeM(); } });
render(); (function w(i){ if(DRK().length||i>40){ return; } setTimeout(()=>w(i+1),250); })(0);
</script>
</body></html>
